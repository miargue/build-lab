<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HandOff — Coming soon</title>

  <!-- Google Fonts: Space Grotesk (headings) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>

  <header class="site-header">
    <nav class="navbar container">
      <a href="index.html" class="logo">HandOff</a>
      <a href="index.html" class="back-link">Back to landing page</a>
    </nav>
  </header>

  <main>
    <section id="coming-soon" class="coming-soon">
      <div class="container coming-soon-card">
        <span class="eyebrow">Coming soon</span>
        <h1>HandOff is almost ready.</h1>
        <p class="subcopy">
          Know the shift before you walk in. Join the waitlist to be first
          in line when the handover board opens.
        </p>

        <!-- Waitlist form. Frontend-only for now: confirming success happens
             on this page. Hook up a real backend endpoint later. -->
        <form id="waitlist-form" novalidate>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@company.com"
            required
          />
          <button type="submit" class="btn btn-primary btn-lg">Join the waitlist</button>
        </form>

        <p id="waitlist-message" class="waitlist-message" hidden>
          You're on the list — we'll be in touch.
        </p>

        <p class="footer-note">Free for your first shift.</p>
      </div>
    </section>
  </main>

  <!-- Shared interactions: waitlist confirmation lives in script.js -->
  <script src="script.js?v=2"></script>
</body>
</html>
